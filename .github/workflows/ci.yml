name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: ruff check api core harness_memory_mcp --ignore E501,I001
      - run: ruff format --check core/domain/platform/schema_compatibility_status.py core/domain/platform/schema_incompatible_error.py core/infrastructure/telemetry/telemetry_span_sanitizer.py harness_memory_mcp/config.py harness_memory_mcp/server/app.py harness_memory_mcp/server/factory.py harness_memory_mcp/server/server_lifespan_manager.py

  test-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: harness_memory
          POSTGRES_USER: harness_memory
          POSTGRES_PASSWORD: harness_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness_memory -d harness_memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://harness_memory:harness_memory@127.0.0.1:5432/harness_memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: alembic upgrade head
      - run: harness-memory migrate --status

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest tests/unit

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: harness_memory
          POSTGRES_USER: harness_memory
          POSTGRES_PASSWORD: harness_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness_memory -d harness_memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://harness_memory:harness_memory@127.0.0.1:5432/harness_memory
      TEST_DATABASE_URL: postgresql+psycopg2://harness_memory:harness_memory@127.0.0.1:5432/harness_memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest tests/integration

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest tests/e2e

  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: harness_memory
          POSTGRES_USER: harness_memory
          POSTGRES_PASSWORD: harness_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness_memory -d harness_memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://harness_memory:harness_memory@127.0.0.1:5432/harness_memory
      TEST_DATABASE_URL: postgresql+psycopg2://harness_memory:harness_memory@127.0.0.1:5432/harness_memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest tests/unit tests/integration tests/e2e --cov=api --cov=core --cov=harness_memory_mcp --cov-report=term-missing --cov-fail-under=80

